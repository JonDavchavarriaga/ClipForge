[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipforge"
version = "0.2.0"
description = "Pipeline local de clipping vertical, subtítulos bilingües EN↔ES y publicación para YouTube Shorts y TikTok."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "imageio-ffmpeg>=0.6,<1",
    "opencv-python-headless>=4.9,<5",
    "faster-whisper>=1.1,<2",
    "pysubs2>=1.7,<2",
    "google-api-python-client>=2,<3",
    "google-auth-oauthlib>=1.2,<2",
    "yt-dlp[default]>=2025.11.12",
]

[project.scripts]
clipforge = "clipforge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
